<!DOCTYPE html>
<html>
<head>
  <title>The Library of Beyond</title>
  <style>
    body { font-family: system-ui; padding: 30px; }
    input { padding: 8px; width: 300px; }
    li { margin: 8px 0; }
  </style>
</head>
<body>

<h1>The Library of Beyond</h1>
<p>A public archive of human thought.</p>

<form id="searchForm">
  <input id="search" placeholder="Search the library..." />
</form>

<p>
  <a href="submit.html">Submit a Text</a>
</p>

<ul id="list"></ul>

<script>
let books = [];

fetch("library/catalog.json")
  .then(r => r.json())
  .then(data => {
    books = data;
    render(data);
  });

function render(data) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  data.forEach(book => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = book.file;
    a.textContent = book.title;
    li.appendChild(a);
    list.appendChild(li);
  });
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  const filtered = books.filter(b => b.title.toLowerCase().includes(q));
  render(filtered);
});
</script>

<script>
document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = books.filter(b => b.title.toLowerCase().includes(q));
  render(filtered);
});
</script>
  
</body>
</html>
